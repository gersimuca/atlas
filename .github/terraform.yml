name: Terraform

on:
  pull_request:
    paths: ["infra/**"]
  push:
    branches: [main]
    paths: ["infra/**"]

permissions:
  id-token: write # required for OIDC -> AssumeRoleWithWebIdentity
  contents: read
  pull-requests: write # to comment the plan on the PR

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, prod]
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          # No access keys anywhere in this repo or CI secrets — GitHub's
          # OIDC token is exchanged for short-lived credentials via an IAM
          # role trust policy scoped to this repo.
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/atlas-github-actions
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: terraform init
        working-directory: infra/environments/${{ matrix.environment }}
        run: terraform init

      - name: terraform plan
        id: plan
        working-directory: infra/environments/${{ matrix.environment }}
        run: terraform plan -no-color -out=tfplan | tee plan_output.txt

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/environments/${{ matrix.environment }}/plan_output.txt', 'utf8');
            const truncated = plan.length > 60000 ? plan.slice(0, 60000) + '\n... (truncated)' : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `#### Terraform plan — ${{ matrix.environment }}\n\`\`\`\n${truncated}\n\`\`\``,
            });

  apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Set environment protection rules (required reviewers) on "prod" in
    # the repo's Settings > Environments — that's what actually gates
    # this, not anything in this YAML.
    environment: ${{ matrix.environment }}
    strategy:
      matrix:
        environment: [dev, prod]
      max-parallel: 1 # never apply dev and prod concurrently
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/atlas-github-actions
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: terraform init
        working-directory: infra/environments/${{ matrix.environment }}
        run: terraform init

      - name: terraform apply
        working-directory: infra/environments/${{ matrix.environment }}
        run: terraform apply -auto-approve -input=false