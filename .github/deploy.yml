name: Deploy

on:
  push:
    branches: [main]
    paths: ["apps/**", "k8s/**"]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        default: dev
        type: choice
        options: [dev, prod]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.tag.outputs.tag }}
    strategy:
      matrix:
        service: [api-gateway-service, agent-orchestrator, ingestion-worker]
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/atlas-github-actions
          aws-region: us-east-1

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.service }}
          push: true
          tags: ${{ steps.ecr-login.outputs.registry }}/atlas/${{ matrix.service }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/atlas-github-actions
          aws-region: us-east-1

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name atlas-${{ inputs.environment || 'dev' }} --region us-east-1

      - uses: azure/setup-helm@v4

      - name: helm upgrade
        run: |
          helm upgrade --install atlas k8s/helm/atlas-platform \
            --namespace atlas --create-namespace \
            -f k8s/helm/atlas-platform/values.yaml \
            -f k8s/helm/atlas-platform/values-${{ inputs.environment || 'dev' }}.yaml \
            --set image.registry=${{ steps.ecr-login.outputs.registry }} \
            --set image.tag=${{ needs.build-and-push.outputs.image-tag }} \
            --wait --timeout 5m

      - name: Verify rollout
        run: |
          kubectl -n atlas rollout status deployment/api-gateway-service --timeout=120s
          kubectl -n atlas rollout status deployment/agent-orchestrator --timeout=120s
          kubectl -n atlas rollout status deployment/ingestion-worker --timeout=120s

      - name: Smoke test
        run: |
          kubectl -n atlas port-forward svc/api-gateway-service 8000:8000 &
          sleep 5
          curl -fsS http://localhost:8000/health
