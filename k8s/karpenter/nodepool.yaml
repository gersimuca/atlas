apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: atlas-prod-default
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: atlas-prod-default
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand", "spot"] # let the agent-orchestrator/api pods land on spot; nothing here is stateful
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["m6i.large", "m6a.large", "m6i.xlarge", "m6a.xlarge"]
  limits:
    cpu: "64" # hard ceiling on total Karpenter-managed capacity — a cost guardrail, not just a scheduling hint
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m
